server {
    listen 80;
    server_name example.loc localhost;
    root /var/www/public;

    index index.php;
    charset utf-8;

    # Логи — без них в Docker будет сложно отлаживать
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    client_max_body_size 128M;

    # Оптимизация для статики (Laravel + Vite/Mix)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Отключаем логи для favicon и robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Разделение пути для корректной работы PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Ссылка на сервис из docker-compose
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Таймауты (актуально для долгих миграций или сидов)
        fastcgi_read_timeout 1000;

        # Защита от проброса скриптов
        try_files $uri =404;
    }

    # Кэширование статики (картинки, шрифты, стили)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Запрет доступа к скрытым файлам (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
